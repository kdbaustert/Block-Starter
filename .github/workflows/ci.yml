name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS (WordPress standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            wp: '6.7'
          - php: '8.3'
            wp: latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit
      - name: Install WordPress on SQLite
        run: bin/install-wp.sh "$RUNNER_TEMP/wordpress"
        env:
          WP_VERSION: ${{ matrix.wp }}
      - name: Integration tests
        run: vendor/bin/phpunit --testsuite integration --fail-on-skipped
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
